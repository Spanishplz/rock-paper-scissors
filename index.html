<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <title>Document</title>
        <link rel="stylesheet" href="reset.css">
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div id="header">
            <h1 id="title">Rock, Paper, Scissors!</h1>
        </div>
        <div id="content">
            <div id="content-human">
                <h2>human</h2>
                <div id="human">
                    <img id="rock" alt="" src="images/placeholder.jpg" style="max-height: 125px; max-width: 125px"/>
                    <img id="paper" alt="" src="images/placeholder.jpg" style="max-height: 125px; max-width: 125px"/>
                    <img id="scissors" ALT="" src="images/placeholder.jpg" style="max-height: 125px; max-width: 125px"/>
                </div>
            </div>

            <div id="match">
                <div id="matchInfo">
                    <div id="roundDiv">
                        <span id="roundTitle">ROUND</span>
                        <span id="round">1</span>
                    </div>
                    <div id="scoresDiv">
                        <div id="playerScoreDiv">
                            <span id="playerScoreTitle">
                                Player
                            </span>
                            <span id="playerScore">
                                0
                            </span>
                        </div>
                        <div id="computerScoreDiv">
                            <span id="computerScoreTitle">
                                Computer
                            </span>
                            <span id="computerScore">
                                0
                            </span>
                        </div>
                    </div>
                </div>
                <div id="versusDiv">
                    <div id="selectionDiv">
                        <span id="playerSelection">select!</span>
                        <span id="versus">VS</span>
                        <span id="computerSelection">...processing</span>
                    </div>
                    <div id="roundResultDiv">
                        <span id="roundResult"></span>
                    </div>
                </div>
                <div id="resultDiv">
                    <div id="resultTitle">RESULT</div>
                    <div id="result">Computer wins!</div>
                </div>

            </div>
            <div id="content-computer">
                <div id="computer">
                    <img id="computer" alt="" src="images/placeholder.jpg" style="max-height: 125px; max-width: 125px"/>
                </div>
                <h2>computer</h2>
            </div>
        </div>
        <div id="footer">
            <h1 id="top">the odin project</h1>
        </div>

    </body>
</html>
